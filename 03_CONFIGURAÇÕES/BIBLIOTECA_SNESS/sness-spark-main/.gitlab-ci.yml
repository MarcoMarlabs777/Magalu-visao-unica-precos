stages:
  - Lint
  - Precommit
  - Tests
  - Fortify
  - Release
  - Deploy

image: python:3.11.11

variables:
  GIT_CREDENTIAL_STORE: "/tmp/.git-credentials"
  PIP_EXTRA_INDEX_URL: "https://${USER_PYPI}:${PASSWORD_PYPI}@pypi.magazineluiza.com.br/simple"

create:
  stage: Release
  image: $CIKNIFE_IMAGE
  script:
    - ci-knife create-release --no-prefix --without-npm
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

unit_tests:
  stage: Tests
  before_script:
    - apt-get update
    - apt-get install default-jdk-headless -qq -y
    - make install
  script: make coverage
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+\%)$/'
  only: [ merge_requests ]

precommit:
  stage: Precommit
  before_script:
    - apt update && apt install -y --no-install-recommends git
    - make install
  script:
    - pre-commit run --all-files
  only: [ merge_requests ]

commitlint:
  image: $CIKNIFE_IMAGE
  stage: Lint
  only: [ merge_requests ]
  script:
    - ci-knife commitlint

security-gate:
  stage: Fortify
  image: $CIKNIFE_IMAGE
  script:
    - ci-knife security-scanner
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy_pypi:
  stage: Deploy
  tags:
    - global-docker-tls
  variables:
    TWINE_USERNAME: "${USER_PYPI}"
    TWINE_PASSWORD: "${PASSWORD_PYPI}"
  before_script:
    - apt-get update
    - apt-get install default-jdk-headless -qq -y
    - pip install --upgrade pip
    - pip install build twine
    - make install
  script:
    - make test
    - make deploy
  only:
    - tags
